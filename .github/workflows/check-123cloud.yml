name: Check 123 cloud integration

on:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check cloud123-runtime.js
      - run: node cloud123-runtime.js
      - run: node --check src/index.js
